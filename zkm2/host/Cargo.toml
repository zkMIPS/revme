[package]
name = "revme-host"
version = "0.0.1"
edition = "2021"

[dependencies]
ark-bn254 = { version = "0.5" }
ark-groth16 = { version = "0.5" }
hex = "0.4.3"
serde = { version = "1.0", default-features = false, features = ["derive", "rc"] }
serde_cbor = "0.11.2"
serde_json = { version = "1.0", default-features = false }
zkm2-sdk = { git = "https://github.com/zkMIPS/zkm2", branch = "dev/init", package = "zkm2-sdk" }
zkm2-prover = { git = "https://github.com/zkMIPS/zkm2", branch = "dev/init", package = "zkm2-prover" }
zkm2-verifier = { git = "https://github.com/zkMIPS/zkm2", branch = "dev/init", package = "zkm2-verifier", features = ["ark"] }

models = { path = "../../models" }

[build-dependencies]
zkm2-build = { git = "https://github.com/zkMIPS/zkm2", branch = "dev/init", package = "zkm2-build" }
